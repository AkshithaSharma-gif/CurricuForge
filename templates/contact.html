<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Get in Touch | CurricuForge</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #2c3e50, #3498db);
            margin: 0;
            padding: 0;
            color: white;
        }

        .container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            color: #2c3e50;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
            animation: fadeIn 0.8s ease;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        input,
        textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2c3e50;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1a252f;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #2c3e50;
            font-size: 14px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .rating {
            margin: 15px 0;
            text-align: center;
        }

        .rating label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .stars {
            direction: rtl;
            display: inline-flex;
        }

        .stars input {
            display: none;
        }

        .stars label {
            font-size: 28px;
            color: #ccc;
            cursor: pointer;
            transition: color 0.2s;
        }

        .stars input:checked~label,
        .stars label:hover,
        .stars label:hover~label {
            color: #f1c40f;
        }
    </style>
    <script>
        function validateForm() {
            const name = document.getElementById("name").value.trim();
            const mobile = document.getElementById("mobile").value.trim();
            const email = document.getElementById("email").value.trim();
            const message = document.getElementById("message").value.trim();
            const rating = document.querySelector('input[name="rating"]:checked');
            const error = document.getElementById("errorMsg");

            error.innerText = "";

            if (name.length < 3) {
                error.innerText = "Name must be at least 3 characters long.";
                return false;
            }

            // Mobile number validation (10 digits)
            if (!/^[6-9]\d{9}$/.test(mobile)) {
                error.innerText = "Please enter a valid 10-digit mobile number.";
                return false;
            }

            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                error.innerText = "Please enter a valid email address.";
                return false;
            }

            if (message.length < 10) {
                error.innerText = "Message must contain at least 10 characters.";
                return false;
            }

            if (!rating) {
                error.innerText = "Please select a rating.";
                return false;
            }

            alert("Thank you for contacting us!");
            return true;
        }
    </script>

</head>

<body>

    <div class="container">
        <h1>Get in Touch</h1>
        <p>We’d love to hear from you</p>

        <form onsubmit="return validateForm()">

            <input type="text" id="name" placeholder="Your Name">
            <input type="text" id="mobile" placeholder="Mobile Number">
            <input type="email" id="email" placeholder="Your Email">
            <textarea id="message" rows="4" placeholder="Your Message"></textarea>

            <!-- Rating Section -->
            <div class="rating">
                <label>Rate Your Experience</label>
                <div class="stars">
                    <input type="radio" name="rating" id="r5" value="5">
                    <label for="r5">★</label>

                    <input type="radio" name="rating" id="r4" value="4">
                    <label for="r4">★</label>

                    <input type="radio" name="rating" id="r3" value="3">
                    <label for="r3">★</label>

                    <input type="radio" name="rating" id="r2" value="2">
                    <label for="r2">★</label>

                    <input type="radio" name="rating" id="r1" value="1">
                    <label for="r1">★</label>
                </div>
            </div>

            <p id="errorMsg"></p>

            <button type="submit">Submit</button>
        </form>


        <a href="/" class="back">⬅ Back to Home</a>
    </div>

</body>

</html>
